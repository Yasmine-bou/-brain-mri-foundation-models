
# SSL3D preprocessing configuration
# EPFL CS-433 — Brain MRI Foundation Models

datasets:
  feta:
    nnunet_id: 101
    name: Dataset101_FeTA
    modality: T2w
    expected_cases:
      train: 48
      val: 16
      test: 16
    split_file: data/splits/feta_splits.json

  bobs:
    nnunet_id: 102
    name: Dataset102_BOBs
    modality: T2w
    expected_cases:
      train: 42
      val: 15
      test: 14
    split_file: data/splits/bobs_splits.json

ssl3d:
  architecture: ResEncL
  configuration: 3d_fullres
  target_spacing_mm: [1.0, 1.0, 1.0]
  normalization: ZScoreNormalization
  adaptation_mode: like_pretrained

environment:
  docker_image: petermcgor/nnunetv2:1.1.0-nnssl
